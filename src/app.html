<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />

		<!-- Viewport / safe areas -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

		<!-- Color scheme hints for UA widgets (matches your light/dark support) -->
		<meta name="color-scheme" content="light dark" />

		<!-- Theme color: light & dark (affects browser UI / Android status bar) -->
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F1EFE8" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#090A0A" />

		<!-- SEO -->
		<meta
			name="description"
			content="Crust & Crumb — small-batch breads and pastries, baked fresh daily."
		/>

		<!-- Open Graph -->
		<meta property="og:title" content="Crust & Crumb" />
		<meta property="og:description" content="Small-batch breads and pastries, baked fresh daily." />
		<meta property="og:type" content="website" />
		<meta property="og:image" content="%sveltekit.assets%/og-cover.jpg" />
		<meta property="og:url" content="https://crustandcrumb.kitchen" />

		<!-- Twitter -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Crust & Crumb" />
		<meta
			name="twitter:description"
			content="Small-batch breads and pastries, baked fresh daily."
		/>
		<meta name="twitter:image" content="%sveltekit.assets%/og-cover.jpg" />

		<!-- Icons / PWA -->
		<link
			rel="icon"
			href="https://ik.imagekit.io/bip1v395ybp/favicon.ico?updatedAt=1760093424796"
			type="image/vnd.microsoft.icon"
		/>
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="mask-icon" href="%sveltekit.assets%/safari-pinned-tab.svg" color="#0f766e" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />

		<!-- Fonts (choose 1–2 families, keep swap). Preconnect to both hosts. -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;1,400&family=Manrope:wght@400;600;700&display=swap"
			rel="stylesheet"
		/>

		<!-- Analytics (Pirsch) -->
		<script
			defer
			src="https://api.pirsch.io/pa.js"
			id="pirschjs"
			data-code="BST47bCDJ6H3wxGC3GUKWRNms70GvSkX"
		></script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" data-sveltekit-preload-code="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
